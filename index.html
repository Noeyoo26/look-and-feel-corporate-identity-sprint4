<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloemenveld Prototype - Plantencollectie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header> 
        <button type="button">
            &#9776;
            <span class="visually-hidden">Menu</span>
        </button>
        <h1>Veldverkenner</h1>
    </header>

    <main>
        <img src="assets/Bloemenveld_kaart.svg" alt="Kaart van het bloemenveld">

        <button type="button" class="pin">
            <img src="assets/Pin_plant-02.svg" alt="Bekijk Witte Dovenetel op de kaart" width="65" height="65">
        </button>

        <section>
            <nav>
                <h2 class="visually-hidden">Weergave</h2>
                <ul>
                    <li><a href="veldverkenner.html" class="active">Kaartoverzicht</a></li>
                    <li><a href="collectie.html">Plantencollectie</a></li>
                </ul>
            </nav>

            <details open>
                <summary>
                    <h2>Witte Dovenetel</h2>
                    <i lang="la">Lamium album</i>  <!-- lang="la" is WCAG vriendelijk la staat voor latijns -->
                    <img src="assets/Dovenetel.jpg" alt="Witte dovenetel in bloei">
                </summary>

                <p><strong>Lijkt op brandnetel maar prikt niet.</strong> Bloeit lang door zacht weer.</p>
                <p><strong>Ecologische rol:</strong> Hommels halen nectar via "gaatjes" in de bloem en voor veel vlinders een plant van waarde.</p>
            </details>
        </section>
    </main>

    
</body>
</html>
